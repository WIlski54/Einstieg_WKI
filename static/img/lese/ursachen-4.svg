<path d='M70,122 l4,12 l12,-6 l-8,10 l12,6 l-13,1 l2,13 l-9,-10 l-9,10 l2,-13 l-13,-1 l12,-6 l-8,-10 l12,6 z' fill='#F7B800' stroke='#dc2626' stroke-width='2'/>
