<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' role='img' aria-label='Der Versailler Vertrag 1919' font-family='Lato, Arial, sans-serif'>
<title>Der Versailler Vertrag 1919</title>
<rect width='400' height='240' rx='14' fill='#eef5fb'/>
<rect x='30' y='30' width='200' height='190' rx='6' fill='#fff' stroke='#004b80' stroke-width='2'/>
<text x='130' y='56' font-size='11' font-weight='900' fill='#004b80' text-anchor='middle'>VERTRAG VON VERSAILLES</text>
<text x='130' y='72' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>28. Juni 1919</text>
<text x='44' y='100' font-size='11' font-weight='700' fill='#dc2626' text-anchor='start'>Art. 231: Deutschland ist schuld</text>
<text x='44' y='124' font-size='11' font-weight='700' fill='#1e293b' text-anchor='start'>Reparationen: Geld für Schäden</text>
<text x='44' y='148' font-size='11' font-weight='700' fill='#1e293b' text-anchor='start'>−13 % Gebiet, alle Kolonien</text>
<text x='44' y='172' font-size='11' font-weight='700' fill='#1e293b' text-anchor='start'>Heer: nur noch 100.000 Mann</text>
<circle cx='196' cy='196' r='14' fill='#dc2626'/><text x='196' y='201' font-size='10' font-weight='900' fill='#fff' text-anchor='middle'>SIEGEL</text>
<rect x='270' y='120' width='60' height='10' fill='#004b80'/><rect x='274' y='130' width='6' height='36' fill='#004b80'/><rect x='320' y='130' width='6' height='36' fill='#004b80'/><rect x='274' y='86' width='6' height='34' fill='#004b80'/>
<path d='M282,92 L318,128 M318,92 L282,128' stroke='#dc2626' stroke-width='5' stroke-linecap='round'/>
<text x='300' y='190' font-size='11' font-weight='700' fill='#1e293b' text-anchor='middle'>Deutschland darf</text>
<text x='300' y='204' font-size='11' font-weight='700' fill='#1e293b' text-anchor='middle'>nicht mitverhandeln</text>
<text x='300' y='222' font-size='12' font-weight='900' fill='#dc2626' text-anchor='middle'>→ „Diktat“</text>
</svg>
