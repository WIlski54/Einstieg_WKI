<text x='326' y='96' font-size='11' font-weight='400' fill='#6b7280' text-anchor='middle'>28. Juni 1914</text>
<rect x='210' y='130' width='176' height='80' rx='10' fill='#fff' stroke='#6b7280' stroke-width='2'/><text x='298.0' y='159.0' font-size='12' font-weight='400' fill='#1e293b' text-anchor='middle'>Ohne Pulverfass</text><text x='298.0' y='174.0' font-size='12' font-weight='400' fill='#1e293b' text-anchor='middle'>hätte der Funke</text><text x='298.0' y='189.0' font-size='12' font-weight='400' fill='#1e293b' text-anchor='middle'>nichts entzündet.</text>
