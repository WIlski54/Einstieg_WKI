<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' role='img' aria-label='Funke und Pulverfass' font-family='Lato, Arial, sans-serif'>
<title>Funke und Pulverfass</title>
<rect width='400' height='240' rx='14' fill='#eef5fb'/>
