<text x='115' y='200' font-size='12' font-weight='900' fill='#004b80' text-anchor='middle'>PULVERFASS = Ursachen</text>
<text x='115' y='94' font-size='10' font-weight='700' fill='#fff' text-anchor='middle'>Imperialismus</text>
