<text x='115' y='130' font-size='10' font-weight='700' fill='#fff' text-anchor='middle'>Militarismus</text>
<text x='115' y='148' font-size='10' font-weight='700' fill='#fff' text-anchor='middle'>Bündnisse</text>
<path d='M230,62 l4,12 l12,-6 l-8,10 l12,6 l-13,1 l2,13 l-9,-10 l-9,10 l2,-13 l-13,-1 l12,-6 l-8,-10 l12,6 z' fill='#F7B800' stroke='#dc2626' stroke-width='2'/>
<defs><marker id='mdc2626' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#dc2626'/></marker></defs><line x1='232' y1='96' x2='180' y2='120' stroke='#dc2626' stroke-width='3' marker-end='url(#mdc2626)' stroke-dasharray='6 4'/>
