<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' role='img' aria-label='Die Oberste Heeresleitung' font-family='Lato, Arial, sans-serif'>
<title>Die Oberste Heeresleitung</title>
<rect width='400' height='240' rx='14' fill='#eef5fb'/>
<circle cx='120' cy='80' r='9.600000000000001' fill='#004b80'/><path d='M107.2,118.4 v-16.0 a12.8,12.8 0 0 1 25.6,0 v16.0 z' fill='#004b80'/>
<circle cx='200' cy='80' r='9.600000000000001' fill='#004b80'/><path d='M187.2,118.4 v-16.0 a12.8,12.8 0 0 1 25.6,0 v16.0 z' fill='#004b80'/>
<text x='120' y='140' font-size='12' font-weight='900' fill='#1e293b' text-anchor='middle'>Hindenburg</text>
<text x='200' y='140' font-size='12' font-weight='900' fill='#1e293b' text-anchor='middle'>Ludendorff</text>
<text x='160' y='160' font-size='11' font-weight='400' fill='#1e293b' text-anchor='middle'>Die beiden Generäle führen das Heer</text>
<text x='160' y='176' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>und bestimmen ab 1916 fast die ganze Politik.</text>
<rect x='250' y='50' width='136' height='110' rx='10' fill='#fff' stroke='#dc2626' stroke-width='2'/><text x='318.0' y='88.83333333333333' font-size='10' font-weight='700' fill='#dc2626' text-anchor='middle'>29. Sept. 1918:</text><text x='318.0' y='101.83333333333333' font-size='10' font-weight='700' fill='#dc2626' text-anchor='middle'>Sie verlangen sofort</text><text x='318.0' y='114.83333333333333' font-size='10' font-weight='700' fill='#dc2626' text-anchor='middle'>einen Waffenstillstand.</text><text x='318.0' y='127.83333333333333' font-size='10' font-weight='700' fill='#dc2626' text-anchor='middle'>Der Krieg ist verloren.</text>
<text x='200' y='214' font-size='10' font-weight='700' fill='#AD007C' text-anchor='middle'>Später leugnen sie das – die „Dolchstoßlegende“ entsteht.</text>
</svg>
