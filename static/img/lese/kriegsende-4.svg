<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' role='img' aria-label='Waffenstillstand und Dolchstoßlegende' font-family='Lato, Arial, sans-serif'>
<title>Waffenstillstand und Dolchstoßlegende</title>
<rect width='400' height='240' rx='14' fill='#eef5fb'/>
<rect x='20' y='70' width='150' height='60' rx='8' fill='#5b3b22' stroke='#004b80' stroke-width='2'/><rect x='30' y='80' width='30' height='24' fill='#fff'/><rect x='70' y='80' width='30' height='24' fill='#fff'/><rect x='110' y='80' width='30' height='24' fill='#fff'/><circle cx='50' cy='138' r='9' fill='#111'/><circle cx='140' cy='138' r='9' fill='#111'/><rect x='0' y='146' width='190' height='4' fill='#6b7280'/>
<text x='95' y='40' font-size='11' font-weight='900' fill='#004b80' text-anchor='middle'>Eisenbahnwagen bei Compiègne</text>
<text x='95' y='56' font-size='10' font-weight='400' fill='#1e293b' text-anchor='middle'>11. Nov. 1918, 11 Uhr: Waffenstillstand</text>
<text x='95' y='176' font-size='11' font-weight='700' fill='#16a34a' text-anchor='middle'>Die Waffen schweigen.</text>
<circle cx='275' cy='78' r='7.199999999999999' fill='#004b80'/><path d='M265.4,106.8 v-12.0 a9.6,9.6 0 0 1 19.2,0 v12.0 z' fill='#004b80'/>
<path d='M312,84 l-22,9' stroke='#dc2626' stroke-width='5' stroke-linecap='round'/><path d='M312,84 l8,-4 l-2,8 z' fill='#dc2626'/>
<text x='300' y='148' font-size='11' font-weight='900' fill='#AD007C' text-anchor='middle'>„Dolchstoßlegende“:</text>
<text x='300' y='162' font-size='10' font-weight='400' fill='#1e293b' text-anchor='middle'>Heimat hat das Heer verraten?</text>
<path d='M262,68 L318,124 M318,68 L262,124' stroke='#dc2626' stroke-width='5' stroke-linecap='round'/>
<rect x='210' y='176' width='180' height='54' rx='10' fill='#fff' stroke='#dc2626' stroke-width='2'/><text x='300.0' y='193.33333333333334' font-size='10' font-weight='700' fill='#dc2626' text-anchor='middle'>FALSCH! Die Generäle selbst</text><text x='300.0' y='206.33333333333334' font-size='10' font-weight='700' fill='#dc2626' text-anchor='middle'>hatten den Waffenstillstand</text><text x='300.0' y='219.33333333333334' font-size='10' font-weight='700' fill='#dc2626' text-anchor='middle'>verlangt (29. Sept.).</text>
</svg>
