<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' role='img' aria-label='Oktoberreformen und die Verbündeten geben auf' font-family='Lato, Arial, sans-serif'>
<title>Oktoberreformen und die Verbündeten geben auf</title>
<rect width='400' height='240' rx='14' fill='#eef5fb'/>
<rect x='30' y='110' width='140' height='70' fill='#fff' stroke='#004b80' stroke-width='2'/><path d='M60,110 a40,32 0 0 1 80,0 z' fill='#fff' stroke='#004b80' stroke-width='2'/><rect x='45' y='130' width='12' height='50' fill='#004b80'/><rect x='75' y='130' width='12' height='50' fill='#004b80'/><rect x='105' y='130' width='12' height='50' fill='#004b80'/><rect x='135' y='130' width='12' height='50' fill='#004b80'/>
<text x='100' y='200' font-size='11' font-weight='900' fill='#004b80' text-anchor='middle'>Reichstag bekommt Macht</text>
<text x='100' y='214' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>Oktober 1918: Reformen</text>
<text x='300' y='40' font-size='13' font-weight='900' fill='#dc2626' text-anchor='middle'>Verbündete geben auf:</text>
