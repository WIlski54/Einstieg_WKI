<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' role='img' aria-label='Spanische Grippe 1918–1920' font-family='Lato, Arial, sans-serif'>
<title>Spanische Grippe 1918–1920</title>
<rect width='400' height='240' rx='14' fill='#eef5fb'/>
<circle cx='120' cy='120' r='40' fill='#AD007C'/><line x1='120' y1='120' x2='176' y2='120' stroke='#AD007C' stroke-width='6' stroke-linecap='round'/><line x1='120' y1='120' x2='64' y2='120' stroke='#AD007C' stroke-width='6' stroke-linecap='round'/><line x1='120' y1='120' x2='120' y2='176' stroke='#AD007C' stroke-width='6' stroke-linecap='round'/><line x1='120' y1='120' x2='120' y2='64' stroke='#AD007C' stroke-width='6' stroke-linecap='round'/><line x1='120' y1='120' x2='159.2' y2='159.2' stroke='#AD007C' stroke-width='6' stroke-linecap='round'/><line x1='120' y1='120' x2='80.80000000000001' y2='159.2' stroke='#AD007C' stroke-width='6' stroke-linecap='round'/><line x1='120' y1='120' x2='159.2' y2='80.80000000000001' stroke='#AD007C' stroke-width='6' stroke-linecap='round'/><line x1='120' y1='120' x2='80.80000000000001' y2='80.80000000000001' stroke='#AD007C' stroke-width='6' stroke-linecap='round'/><circle cx='120' cy='120' r='16' fill='#fff'/>
<text x='280' y='80' font-size='13' font-weight='900' fill='#AD007C' text-anchor='middle'>Weltweite Grippewelle</text>
<text x='280' y='100' font-size='12' font-weight='700' fill='#1e293b' text-anchor='middle'>1918 bis 1920</text>
<text x='280' y='130' font-size='11' font-weight='400' fill='#1e293b' text-anchor='middle'>Viele Millionen Tote –</text>
<text x='280' y='146' font-size='11' font-weight='400' fill='#1e293b' text-anchor='middle'>mehr als im Krieg selbst.</text>
<text x='280' y='176' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>Soldaten trugen das Virus</text>
<text x='280' y='190' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>um die ganze Welt.</text>
</svg>
