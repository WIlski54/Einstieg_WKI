<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' role='img' aria-label='Blankoscheck und Ultimatum' font-family='Lato, Arial, sans-serif'>
<title>Blankoscheck und Ultimatum</title>
<rect width='400' height='240' rx='14' fill='#eef5fb'/>
<rect x='16' y='40' width='180' height='96' rx='8' fill='#fff' stroke='#004b80' stroke-width='2'/>
<text x='106' y='62' font-size='12' font-weight='900' fill='#6b7280' text-anchor='middle'>SCHECK</text>
<text x='30' y='86' font-size='12' font-weight='700' fill='#1e293b' text-anchor='start'>Betrag: __________</text>
<text x='30' y='108' font-size='12' font-weight='400' fill='#1e293b' text-anchor='start'>Von: Berlin   An: Wien</text>
<text x='30' y='126' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>Unterschrift: Wilhelm II.</text>
<text x='106' y='156' font-size='12' font-weight='900' fill='#AD007C' text-anchor='middle'>„Blankoscheck“ (5./6. Juli)</text>
<text x='106' y='172' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>= volle Unterstützung, egal was Wien tut</text>
<rect x='232' y='44' width='150' height='70' rx='8' fill='#fff' stroke='#dc2626' stroke-width='2'/><path d='M232,44 l75,40 l75,-40' fill='none' stroke='#dc2626' stroke-width='2'/>
<text x='307' y='100' font-size='11' font-weight='900' fill='#dc2626' text-anchor='middle'>Ultimatum an Serbien</text>
<circle cx='262' cy='160' r='22' fill='#fff' stroke='#004b80' stroke-width='3'/><line x1='262' y1='160' x2='262' y2='144' stroke='#004b80' stroke-width='3'/><line x1='262' y1='160' x2='274' y2='166' stroke='#004b80' stroke-width='3'/>
<text x='262' y='200' font-size='12' font-weight='900' fill='#1e293b' text-anchor='middle'>48 Stunden</text>
<text x='340' y='150' font-size='12' font-weight='700' fill='#1e293b' text-anchor='middle'>23. Juli</text>
<text x='340' y='168' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>Serbien sagt</text><text x='340' y='182' font-size='10' fill='#6b7280' text-anchor='middle'>fast alles zu</text>
<text x='340' y='214' font-size='13' font-weight='900' fill='#dc2626' text-anchor='middle'>28. Juli: Krieg!</text>
</svg>
