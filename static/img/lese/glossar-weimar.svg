<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' role='img' aria-label='Die Weimarer Republik' font-family='Lato, Arial, sans-serif'>
<title>Die Weimarer Republik</title>
<rect width='400' height='240' rx='14' fill='#eef5fb'/>
<rect x='40' y='50' width='150' height='34' fill='#111'/><rect x='40' y='84' width='150' height='34' fill='#dc2626'/><rect x='40' y='118' width='150' height='34' fill='#F7B800'/>
<text x='115' y='176' font-size='11' font-weight='700' fill='#1e293b' text-anchor='middle'>Schwarz-Rot-Gold</text>
<text x='115' y='190' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>Flagge der Republik</text>
<rect x='220' y='50' width='160' height='40' rx='10' fill='#fff' stroke='#004b80' stroke-width='2'/><text x='300.0' y='74.33333333333333' font-size='13' font-weight='700' fill='#1e293b' text-anchor='middle'>1919–1933</text>
<text x='300' y='118' font-size='12' font-weight='900' fill='#004b80' text-anchor='middle'>Erste Demokratie</text>
<text x='300' y='134' font-size='12' font-weight='900' fill='#004b80' text-anchor='middle'>in Deutschland</text>
<text x='300' y='160' font-size='10' font-weight='400' fill='#1e293b' text-anchor='middle'>Alle Männer und Frauen</text>
<text x='300' y='174' font-size='10' font-weight='400' fill='#1e293b' text-anchor='middle'>ab 20 dürfen wählen.</text>
<text x='300' y='200' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>Belastet durch Versailles,</text>
<text x='300' y='214' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>Krisen und alte Eliten.</text>
</svg>
