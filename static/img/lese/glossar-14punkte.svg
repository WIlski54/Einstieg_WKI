<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' role='img' aria-label='Die 14 Punkte von US-Präsident Wilson' font-family='Lato, Arial, sans-serif'>
<title>Die 14 Punkte von US-Präsident Wilson</title>
<rect width='400' height='240' rx='14' fill='#eef5fb'/>
<rect x='40' y='30' width='170' height='190' rx='6' fill='#fff' stroke='#004b80' stroke-width='2'/>
<text x='125' y='56' font-size='11' font-weight='900' fill='#004b80' text-anchor='middle'>14 PUNKTE (Jan. 1918)</text>
<text x='52' y='84' font-size='10' font-weight='400' fill='#1e293b' text-anchor='start'>• keine Geheimverträge</text>
<text x='52' y='104' font-size='10' font-weight='400' fill='#1e293b' text-anchor='start'>• freie Meere</text>
<text x='52' y='124' font-size='10' font-weight='400' fill='#1e293b' text-anchor='start'>• Abrüstung</text>
<text x='52' y='144' font-size='10' font-weight='400' fill='#1e293b' text-anchor='start'>• Völker bestimmen selbst</text>
<text x='52' y='164' font-size='10' font-weight='400' fill='#1e293b' text-anchor='start'>• Elsass-Lothringen an Frankreich</text>
<text x='52' y='184' font-size='10' font-weight='400' fill='#1e293b' text-anchor='start'>• ein Völkerbund</text>
<text x='52' y='204' font-size='10' font-weight='400' fill='#6b7280' text-anchor='start'>• …</text>
<rect x='250' y='40' width='60' height='36' rx='3' fill='#006AB3' stroke='#fff' stroke-width='1.5'/><text x='280.0' y='63.0' font-size='12' font-weight='900' fill='#fff' text-anchor='middle'>USA</text>
<text x='310' y='100' font-size='12' font-weight='900' fill='#1e293b' text-anchor='middle'>Woodrow Wilson</text>
<text x='310' y='116' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>US-Präsident</text>
<rect x='230' y='140' width='160' height='70' rx='10' fill='#fff' stroke='#6b7280' stroke-width='2'/><text x='310.0' y='165.33333333333334' font-size='10' font-weight='400' fill='#1e293b' text-anchor='middle'>Deutschland hoffte auf</text><text x='310.0' y='178.33333333333334' font-size='10' font-weight='400' fill='#1e293b' text-anchor='middle'>einen milden Frieden.</text><text x='310.0' y='191.33333333333334' font-size='10' font-weight='400' fill='#1e293b' text-anchor='middle'>Versailles wurde härter.</text>
</svg>
