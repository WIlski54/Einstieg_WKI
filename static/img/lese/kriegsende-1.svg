<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' role='img' aria-label='Sommer 1918: militärisch verloren – die Waage kippt' font-family='Lato, Arial, sans-serif'>
<title>Sommer 1918: militärisch verloren – die Waage kippt</title>
<rect width='400' height='240' rx='14' fill='#eef5fb'/>
<style>@keyframes kippen{0%{transform:rotate(0deg)}70%{transform:rotate(16deg)}85%{transform:rotate(13deg)}100%{transform:rotate(14deg)}}@keyframes hochL{0%{transform:translate(0,0)}70%{transform:translate(5px,-38px)}85%{transform:translate(4px,-31px)}100%{transform:translate(4px,-34px)}}@keyframes runterR{0%{transform:translate(0,0)}70%{transform:translate(-5px,38px)}85%{transform:translate(-4px,31px)}100%{transform:translate(-4px,34px)}}@keyframes rein{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}.balken{transform-origin:200px 128px;animation:kippen 2.2s ease-in-out 1.7s forwards}.schaleL{animation:hochL 2.2s ease-in-out 1.7s forwards}.schaleR{animation:runterR 2.2s ease-in-out 1.7s forwards}.soldat{opacity:0;animation:rein .5s ease-out forwards}.s1{animation-delay:.3s}.s2{animation-delay:.75s}.s3{animation-delay:1.2s}@media (prefers-reduced-motion:reduce){.balken,.schaleL,.schaleR,.soldat{animation:none}.balken{transform:rotate(14deg)}.schaleL{transform:translate(4px,-34px)}.schaleR{transform:translate(-4px,34px)}.soldat{opacity:1}}</style>
<text x='200' y='26' font-size='14' font-weight='900' fill='#004b80' text-anchor='middle'>Die Waage kippt</text>
<rect x='194' y='128' width='12' height='70' fill='#004b80'/><rect x='156' y='196' width='88' height='10' rx='4' fill='#004b80'/>
<g class='balken'><line x1='60' y1='128' x2='340' y2='128' stroke='#004b80' stroke-width='8' stroke-linecap='round'/><circle cx='200' cy='128' r='7' fill='#F7B800' stroke='#004b80' stroke-width='2'/></g>
<g class='schaleL'><line x1='60' y1='128' x2='60' y2='146' stroke='#6b7280' stroke-width='2'/><rect x='14' y='146' width='92' height='40' rx='10' fill='#fde7f3' stroke='#AD007C' stroke-width='2'/><text x='60.0' y='162.83333333333334' font-size='10' font-weight='700' fill='#AD007C' text-anchor='middle'>Deutschland:</text><text x='60.0' y='175.83333333333334' font-size='10' font-weight='700' fill='#AD007C' text-anchor='middle'>erschöpft, Hunger</text></g>
<g class='schaleR'><line x1='340' y1='128' x2='340' y2='150' stroke='#6b7280' stroke-width='2'/><g class='soldat s1'><circle cx='302' cy='130' r='3.5999999999999996' fill='#1e3a5f'/><path d='M297.2,144.4 v-6.0 a4.8,4.8 0 0 1 9.6,0 v6.0 z' fill='#1e3a5f'/></g><g class='soldat s2'><circle cx='322' cy='130' r='3.5999999999999996' fill='#1e3a5f'/><path d='M317.2,144.4 v-6.0 a4.8,4.8 0 0 1 9.6,0 v6.0 z' fill='#1e3a5f'/></g><g class='soldat s3'><circle cx='342' cy='130' r='3.5999999999999996' fill='#1e3a5f'/><path d='M337.2,144.4 v-6.0 a4.8,4.8 0 0 1 9.6,0 v6.0 z' fill='#1e3a5f'/></g><rect x='284' y='150' width='110' height='50' rx='10' fill='#dbe9f7' stroke='#006AB3' stroke-width='2'/><text x='339.0' y='165.33333333333334' font-size='10' font-weight='700' fill='#004b80' text-anchor='middle'>Alliierte + USA:</text><text x='339.0' y='178.33333333333334' font-size='10' font-weight='700' fill='#004b80' text-anchor='middle'>10.000 neue</text><text x='339.0' y='191.33333333333334' font-size='10' font-weight='700' fill='#004b80' text-anchor='middle'>Soldaten jeden Tag</text></g>
<rect x='10' y='190' width='134' height='46' rx='6' fill='#fff' stroke='#dc2626' stroke-width='2'/>
<text x='77' y='204' font-size='10' font-weight='800' fill='#dc2626' text-anchor='middle'>29. Sept. 1918:</text>
<text x='77' y='216' font-size='10' font-weight='700' fill='#dc2626' text-anchor='middle'>Die Generäle verlangen</text>
<text x='77' y='228' font-size='10' font-weight='700' fill='#dc2626' text-anchor='middle'>einen Waffenstillstand</text>
</svg>
