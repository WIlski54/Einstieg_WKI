<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' role='img' aria-label='Sommer 1918: militärisch verloren' font-family='Lato, Arial, sans-serif'>
<title>Sommer 1918: militärisch verloren</title>
<rect width='400' height='240' rx='14' fill='#eef5fb'/>
<rect x='190' y='60' width='20' height='120' fill='#004b80'/><rect x='150' y='180' width='100' height='12' rx='4' fill='#004b80'/>
<line x1='60' y1='52' x2='340' y2='96' stroke='#004b80' stroke-width='8' stroke-linecap='round'/>
<line x1='70' y1='54' x2='70' y2='84' stroke='#6b7280' stroke-width='2'/><line x1='330' y1='94' x2='330' y2='140' stroke='#6b7280' stroke-width='2'/>
<rect x='14' y='84' width='112' height='44' rx='10' fill='#fde7f3' stroke='#AD007C' stroke-width='2'/><text x='70.0' y='102.83333333333333' font-size='10' font-weight='700' fill='#AD007C' text-anchor='middle'>Deutschland:</text><text x='70.0' y='115.83333333333333' font-size='10' font-weight='700' fill='#AD007C' text-anchor='middle'>erschöpft, Hunger</text>
<rect x='268' y='140' width='124' height='54' rx='10' fill='#dbe9f7' stroke='#006AB3' stroke-width='2'/><text x='330.0' y='157.33333333333334' font-size='10' font-weight='700' fill='#004b80' text-anchor='middle'>Alliierte + USA:</text><text x='330.0' y='170.33333333333334' font-size='10' font-weight='700' fill='#004b80' text-anchor='middle'>10.000 neue Soldaten</text><text x='330.0' y='183.33333333333334' font-size='10' font-weight='700' fill='#004b80' text-anchor='middle'>jeden Tag</text>
<rect x='90' y='200' width='220' height='34' rx='6' fill='#fff' stroke='#dc2626' stroke-width='2'/>
<text x='200' y='214' font-size='10' font-weight='700' fill='#dc2626' text-anchor='middle'>29. Sept. 1918: Die Generäle</text>
<text x='200' y='227' font-size='10' font-weight='700' fill='#dc2626' text-anchor='middle'>verlangen einen Waffenstillstand</text>
<text x='200' y='30' font-size='14' font-weight='900' fill='#004b80' text-anchor='middle'>Die Waage kippt</text>
</svg>
