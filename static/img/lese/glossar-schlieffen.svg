<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' role='img' aria-label='Der Schlieffen-Plan' font-family='Lato, Arial, sans-serif'>
<title>Der Schlieffen-Plan</title>
<rect width='400' height='240' rx='14' fill='#eef5fb'/>
<rect x='40' y='60' width='90' height='70' rx='10' fill='#dbe9f7' stroke='#006AB3' stroke-width='2'/><text x='85.0' y='99.0' font-size='12' font-weight='700' fill='#1e293b' text-anchor='middle'>Frankreich</text>
<rect x='140' y='60' width='60' height='70' rx='10' fill='#f1ead9' stroke='#6b7280' stroke-width='2'/><text x='170.0' y='91.83333333333333' font-size='10' font-weight='700' fill='#1e293b' text-anchor='middle'>Belgien</text><text x='170.0' y='104.83333333333333' font-size='10' font-weight='700' fill='#1e293b' text-anchor='middle'>(neutral)</text>
<rect x='210' y='60' width='90' height='70' rx='10' fill='#e5e7eb' stroke='#6b7280' stroke-width='2'/><text x='255.0' y='91.66666666666667' font-size='11' font-weight='700' fill='#1e293b' text-anchor='middle'>Deutsches</text><text x='255.0' y='105.66666666666667' font-size='11' font-weight='700' fill='#1e293b' text-anchor='middle'>Reich</text>
<rect x='310' y='60' width='80' height='70' rx='10' fill='#dbe9f7' stroke='#006AB3' stroke-width='2'/><text x='350.0' y='99.0' font-size='12' font-weight='700' fill='#1e293b' text-anchor='middle'>Russland</text>
<circle cx='70' cy='110' r='5' fill='#dc2626'/>
<text x='70' y='124' font-size='9' font-weight='700' fill='#fff' text-anchor='middle'>Paris</text>
<defs><marker id='cdc2626' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#dc2626'/></marker></defs><path d='M255,50 C230,10 150,10 90,52' fill='none' stroke='#dc2626' stroke-width='4' marker-end='url(#cdc2626)'/>
<text x='170' y='14' font-size='10' font-weight='900' fill='#dc2626' text-anchor='middle'>1. Durch Belgien nach Paris – in 6 Wochen</text>
<defs><marker id='m004b80' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#004b80'/></marker></defs><line x1='300' y1='100' x2='306' y2='100' stroke='#004b80' stroke-width='4' marker-end='url(#m004b80)' stroke-dasharray='6 4'/>
<text x='300' y='148' font-size='10' font-weight='900' fill='#004b80' text-anchor='middle'>2. Dann alle Truppen nach Osten</text>
<text x='300' y='161' font-size='10' font-weight='900' fill='#004b80' text-anchor='middle'>gegen Russland</text>
<rect x='40' y='170' width='350' height='54' rx='10' fill='#fff' stroke='#6b7280' stroke-width='2'/><text x='215.0' y='193.83333333333334' font-size='10' font-weight='400' fill='#1e293b' text-anchor='middle'>Idee: Russland braucht lange, um mobil zu machen.</text><text x='215.0' y='206.83333333333334' font-size='10' font-weight='400' fill='#1e293b' text-anchor='middle'>Wirklichkeit: Der Plan scheitert im September 1914 an der Marne.</text>
</svg>
